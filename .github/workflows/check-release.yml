name: Check Release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify 1.0.4 updater bridge
        run: |
          ACTUAL=$(sha256sum releases/Church-Communications-1.0.4-updater-bridge.zip | awk '{print $1}')
          EXPECTED=d2a455e61079f6755923efa1f4a7d02fc7c34fae5b6156c249c347b902b5a411
          echo "actual=$ACTUAL"
          echo "expected=$EXPECTED"
          test "$ACTUAL" = "$EXPECTED"
          unzip -t releases/Church-Communications-1.0.4-updater-bridge.zip
          rm -rf /tmp/ccbridge && mkdir -p /tmp/ccbridge
          unzip -q releases/Church-Communications-1.0.4-updater-bridge.zip -d /tmp/ccbridge
          php -l /tmp/ccbridge/Church-Communications/config.php
          php -l /tmp/ccbridge/Church-Communications/lib/bootstrap.php
          php -l /tmp/ccbridge/Church-Communications/lib/updater.php
          grep -F "define('CC_VERSION', '1.0.4');" /tmp/ccbridge/Church-Communications/config.php
