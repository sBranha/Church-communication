name: Build Native Mac Location Station

on:
  push:
    branches: [main]
    paths:
      - 'staging/native-mac-location-station-2.0.2/READY*'

permissions:
  contents: write

jobs:
  build-native-mac:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and verify staged source
        shell: bash
        run: |
          set -euo pipefail
          cat staging/native-mac-location-station-2.0.2/part-*.b64 | base64 -D > /tmp/native-mac-source.zip
          ACTUAL=$(shasum -a 256 /tmp/native-mac-source.zip | awk '{print $1}')
          EXPECTED=e15e9f28d3c454992c217de046a0dbb0621db81c54410b4b25cb2f760c57fcc5
          SIZE=$(stat -f%z /tmp/native-mac-source.zip)
          echo "source sha256=$ACTUAL size=$SIZE"
          test "$ACTUAL" = "$EXPECTED"
          test "$SIZE" = '20594'
          unzip -t /tmp/native-mac-source.zip
          rm -rf /tmp/native-src
          mkdir -p /tmp/native-src
          ditto -x -k /tmp/native-mac-source.zip /tmp/native-src
          test -f /tmp/native-src/main.m
          test -f /tmp/native-src/Info.plist
          test -f /tmp/native-src/AppIcon-1024.png
          plutil -lint /tmp/native-src/Info.plist

          sed -i '' 's/newMessageButton/composeButton/g' /tmp/native-src/main.m
          sed -i '' 's#ChurchCommunications-Mac-Native/2.0.1#ChurchCommunications-Mac-Native/2.0.4#g' /tmp/native-src/main.m
          sed -i '' 's#https://compassionworship.com/cc/app/location-helper-api.php#https://www.compassionworship.com/cc/app/location-helper-api.php#g' /tmp/native-src/main.m
          sed -i '' 's#<string>2.0.1</string>#<string>2.0.4</string>#g' /tmp/native-src/Info.plist
          sed -i '' 's#<string>200</string>#<string>204</string>#g' /tmp/native-src/Info.plist

          echo '=== MAC PAIRING SOURCE EXCERPT ==='
          grep -n -E -C 12 'pair_json|location-helper-api|Pair|pair' /tmp/native-src/main.m | head -n 220 || true
          echo '=== END MAC PAIRING SOURCE EXCERPT ==='

          grep -q 'composeButton' /tmp/native-src/main.m
          if grep -q 'newMessageButton' /tmp/native-src/main.m; then exit 1; fi
          grep -q '__block NSInteger finalCursor' /tmp/native-src/main.m
          grep -q 'ChurchCommunications-Mac-Native/2.0.4' /tmp/native-src/main.m
          grep -q 'https://www.compassionworship.com/cc/app/location-helper-api.php' /tmp/native-src/main.m
          grep -q 'NSScreenSaverWindowLevel' /tmp/native-src/main.m
          grep -q 'NSWindowCollectionBehaviorCanJoinAllSpaces' /tmp/native-src/main.m
          grep -q '<string>2.0.4</string>' /tmp/native-src/Info.plist
          grep -q '<string>10.15.0</string>' /tmp/native-src/Info.plist

      - name: Test live pairing API contract
        shell: bash
        run: |
          set -euo pipefail
          URL='https://www.compassionworship.com/cc/app/location-helper-api.php?action=pair_json'
          STATUS=$(curl -sS -o /tmp/pair-body.txt -D /tmp/pair-headers.txt -w '%{http_code}' \
            -X POST "$URL" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/x-www-form-urlencoded; charset=utf-8' \
            -H 'User-Agent: ChurchCommunications-Mac-Native/2.0.4' \
            --data 'code=12345678')
          echo "HTTP_STATUS=$STATUS"
          echo '=== HEADERS ==='
          cat /tmp/pair-headers.txt
          echo '=== BODY ==='
          cat /tmp/pair-body.txt
          echo
          python3 - <<'PY'
          import json
          from pathlib import Path
          body=Path('/tmp/pair-body.txt').read_text(errors='replace')
          try:
              obj=json.loads(body)
          except Exception as e:
              raise SystemExit(f'LIVE PAIRING API IS NOT JSON: {e}; body={body[:1000]!r}')
          if not isinstance(obj,dict) or 'ok' not in obj:
              raise SystemExit(f'LIVE PAIRING API JSON CONTRACT INVALID: {obj!r}')
          print('JSON_OK', obj)
          PY
          test "$STATUS" = '403' || test "$STATUS" = '422'

      - name: Build Intel Catalina native app
        shell: bash
        run: |
          set -euo pipefail
          APP='/tmp/Church Communications Location Station.app'
          EXE="$APP/Contents/MacOS/Church Communications Location Station"
          RES="$APP/Contents/Resources"
          rm -rf "$APP" /tmp/AppIcon.iconset
          mkdir -p "$APP/Contents/MacOS" "$RES" /tmp/AppIcon.iconset
          cp /tmp/native-src/Info.plist "$APP/Contents/Info.plist"
          for spec in '16 icon_16x16.png' '32 icon_16x16@2x.png' '32 icon_32x32.png' '64 icon_32x32@2x.png' '128 icon_128x128.png' '256 icon_128x128@2x.png' '256 icon_256x256.png' '512 icon_256x256@2x.png' '512 icon_512x512.png' '1024 icon_512x512@2x.png'; do
            set -- $spec
            sips -z "$1" "$1" /tmp/native-src/AppIcon-1024.png --out "/tmp/AppIcon.iconset/$2" >/dev/null
          done
          iconutil -c icns /tmp/AppIcon.iconset -o "$RES/AppIcon.icns"
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          xcrun clang -fobjc-arc -fblocks -arch x86_64 -mmacosx-version-min=10.15 -isysroot "$SDK" -framework Cocoa /tmp/native-src/main.m -o "$EXE"
          chmod +x "$EXE"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          lipo -info "$EXE" | grep -q 'x86_64'
          test "$(defaults read "$APP/Contents/Info" LSMinimumSystemVersion)" = '10.15.0'
          test "$(defaults read "$APP/Contents/Info" CFBundleShortVersionString)" = '2.0.4'
          test "$(defaults read "$APP/Contents/Info" CFBundleIconFile)" = 'AppIcon'

      - name: Package and verify Apple DMG
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/location-station-dmg
          OUT='releases/Church-Communications-Mac-Location-Station-2.0.4.dmg'
          rm -rf "$ROOT" "$OUT"
          mkdir -p "$ROOT" releases
          ditto '/tmp/Church Communications Location Station.app' "$ROOT/Church Communications Location Station.app"
          ln -s /Applications "$ROOT/Applications"
          hdiutil create -volname 'Church Communications Location Station' -srcfolder "$ROOT" -ov -format UDZO "$OUT"
          hdiutil verify "$OUT"
          test -s "$OUT"
          shasum -a 256 "$OUT" | tee releases/Church-Communications-Mac-Location-Station-2.0.4.dmg.sha256.txt

      - name: Publish native Mac DMG
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sBranha'
          git config user.email 'sgbcdb@gmail.com'
          git pull --rebase origin main
          git add releases/Church-Communications-Mac-Location-Station-2.0.4.dmg releases/Church-Communications-Mac-Location-Station-2.0.4.dmg.sha256.txt
          git commit -m 'Publish native Mac Location Station 2.0.4' || exit 0
          git push
