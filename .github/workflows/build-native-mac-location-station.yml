name: Build Native Mac Location Station

on:
  push:
    branches: [main]
    paths:
      - 'staging/native-mac-location-station-2.1.0/READY*'

permissions:
  contents: write

jobs:
  build-native-mac:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild exact baseline and replace pairing system
        shell: bash
        run: |
          set -euo pipefail
          cat staging/native-mac-location-station-2.0.2/part-*.b64 | base64 -D > /tmp/native-mac-source.zip
          test "$(shasum -a 256 /tmp/native-mac-source.zip | awk '{print $1}')" = 'e15e9f28d3c454992c217de046a0dbb0621db81c54410b4b25cb2f760c57fcc5'
          unzip -t /tmp/native-mac-source.zip
          rm -rf /tmp/native-src
          mkdir -p /tmp/native-src
          ditto -x -k /tmp/native-mac-source.zip /tmp/native-src

          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/native-src/main.m')
          s=p.read_text()
          s=s.replace('newMessageButton','composeButton')
          s=s.replace('ChurchCommunications-Mac-Native/2.0.1','ChurchCommunications-Mac-Native/2.1.0')
          old='static NSString * const CCServer = @"https://compassionworship.com/cc/app/location-helper-api.php";'
          new='static NSString * const CCServer = @"https://www.compassionworship.com/cc/native-station-api.php";\nstatic NSString * const CCPairURL = @"https://www.compassionworship.com/cc/native-mac-pair.php";'
          if old not in s: raise SystemExit('server constant not found')
          s=s.replace(old,new)
          s=s.replace('static NSString * const CCAppName = @"Church Communications Location Station";','static NSString * const CCAppName = @"Church Communications Location Station — 2.1.0";')

          old_launch='''    if (self.token.length == 0) {
        [self.window makeKeyAndOrderFront:nil];
        [NSApp activateIgnoringOtherApps:YES];
        [self showPairingDialog];
    } else {
        [self startLocationStation];
    }
}'''
          new_launch='''    if (self.token.length == 0) {
        [self.window makeKeyAndOrderFront:nil];
        [NSApp activateIgnoringOtherApps:YES];
        dispatch_after(dispatch_time(DISPATCH_TIME_NOW, (int64_t)(0.8 * NSEC_PER_SEC)), dispatch_get_main_queue(), ^{
            if (self.token.length == 0) [self showPairingDialog];
        });
    } else {
        [self startLocationStation];
    }
}

- (void)application:(NSApplication *)application openURLs:(NSArray<NSURL *> *)urls {
    for (NSURL *url in urls) [self handlePairingCallbackURL:url];
}

- (void)handlePairingCallbackURL:(NSURL *)url {
    if (!url) return;
    if (![[url.scheme lowercaseString] isEqualToString:@"ccstation"] || ![[url.host lowercaseString] isEqualToString:@"paired"]) return;
    NSURLComponents *parts=[NSURLComponents componentsWithURL:url resolvingAgainstBaseURL:NO];
    NSMutableDictionary *v=[NSMutableDictionary dictionary];
    for(NSURLQueryItem *item in parts.queryItems ?: @[]) if(item.name.length) v[item.name]=item.value ?: @"";
    NSString *tok=[v[@"token"] description] ?: @"";
    NSString *name=[v[@"name"] description] ?: @"Location";
    NSInteger lid=[v[@"location_id"] integerValue];
    if(tok.length < 32 || lid <= 0){ [self showError:@"The browser returned an invalid pairing result. Please try Pair Another Location again."]; return; }
    self.token=tok; self.locationName=name.length?name:@"Location"; self.locationID=lid;
    NSUserDefaults *d=[NSUserDefaults standardUserDefaults];
    [d setObject:self.token forKey:CCTokenKey]; [d setObject:self.locationName forKey:CCLocationNameKey]; [d setInteger:self.locationID forKey:CCLocationIDKey]; [d removeObjectForKey:CCCursorKey]; [d synchronize];
    dispatch_async(dispatch_get_main_queue(), ^{ self.locationLabel.stringValue=self.locationName; [self.window makeKeyAndOrderFront:nil]; [NSApp activateIgnoringOtherApps:YES]; });
    [self startLocationStation];
}'''
          if old_launch not in s: raise SystemExit('actual launch block not found')
          s=s.replace(old_launch,new_launch)

          start=s.index('- (void)showPairingDialog {')
          end=s.index('\n- (void)repairClicked:', start)
          new_pair='''- (void)showPairingDialog {
    NSAlert *a = [[NSAlert alloc] init];
    a.messageText = @"Pair This Mac in Your Browser";
    a.informativeText = @"This version uses a completely different pairing system.\\n\\n1. In Church Communications Admin → Locations, choose Pair Device and get the 8-digit code.\\n2. Click Open Pairing Page below.\\n3. Enter that code on the Church Communications web page.\\n4. The browser will send the completed pairing directly back to this Mac app.\\n\\nMac app version 2.1.0";
    [a addButtonWithTitle:@"Open Pairing Page"];
    [a addButtonWithTitle:@"Cancel"];
    [NSApp activateIgnoringOtherApps:YES];
    if ([a runModal] != NSAlertFirstButtonReturn) return;
    NSURLComponents *c=[NSURLComponents componentsWithString:CCPairURL];
    c.queryItems=@[[NSURLQueryItem queryItemWithName:@"source" value:@"mac"],[NSURLQueryItem queryItemWithName:@"app_version" value:@"2.1.0"]];
    if(!c.URL || ![[NSWorkspace sharedWorkspace] openURL:c.URL]) { [self showError:@"Could not open the Church Communications pairing page in your browser."]; return; }
    self.statusLabel.stringValue=@"Waiting for browser pairing…";
}
'''
          s=s[:start]+new_pair+s[end:]
          s=s.replace('This will disconnect the current location from this Mac and ask for a new setup code.','This will disconnect the current location from this Mac and open the new browser pairing page.')
          if '[self postJSONAction:@"pair_json"' in s: raise SystemExit('old direct JSON pairing still present')
          p.write_text(s)

          p=Path('/tmp/native-src/Info.plist')
          info=p.read_text()
          info=info.replace('<string>2.0.1</string>','<string>2.1.0</string>')
          info=info.replace('<string>200</string>','<string>210</string>')
          marker='  <key>LSApplicationCategoryType</key>'
          urltypes='''  <key>CFBundleURLTypes</key>
  <array>
    <dict>
      <key>CFBundleURLName</key><string>Church Communications Location Station Pairing</string>
      <key>CFBundleURLSchemes</key>
      <array><string>ccstation</string></array>
    </dict>
  </array>
'''
          if marker not in info: raise SystemExit('plist insertion point not found')
          info=info.replace(marker,urltypes+marker)
          p.write_text(info)
          PY

          plutil -lint /tmp/native-src/Info.plist
          grep -q 'ChurchCommunications-Mac-Native/2.1.0' /tmp/native-src/main.m
          grep -q 'native-station-api.php' /tmp/native-src/main.m
          grep -q 'native-mac-pair.php' /tmp/native-src/main.m
          grep -q 'Pair This Mac in Your Browser' /tmp/native-src/main.m
          grep -q 'handlePairingCallbackURL' /tmp/native-src/main.m
          grep -q 'ccstation' /tmp/native-src/Info.plist
          ! grep -q 'postJSONAction:@"pair_json"' /tmp/native-src/main.m

      - name: Build and verify Intel Catalina app
        shell: bash
        run: |
          set -euo pipefail
          APP='/tmp/Church Communications Location Station 2.1.0.app'
          EXE="$APP/Contents/MacOS/Church Communications Location Station"
          RES="$APP/Contents/Resources"
          rm -rf "$APP" /tmp/AppIcon.iconset
          mkdir -p "$APP/Contents/MacOS" "$RES" /tmp/AppIcon.iconset
          cp /tmp/native-src/Info.plist "$APP/Contents/Info.plist"
          for spec in '16 icon_16x16.png' '32 icon_16x16@2x.png' '32 icon_32x32.png' '64 icon_32x32@2x.png' '128 icon_128x128.png' '256 icon_128x128@2x.png' '256 icon_256x256.png' '512 icon_256x256@2x.png' '512 icon_512x512.png' '1024 icon_512x512@2x.png'; do
            set -- $spec
            sips -z "$1" "$1" /tmp/native-src/AppIcon-1024.png --out "/tmp/AppIcon.iconset/$2" >/dev/null
          done
          iconutil -c icns /tmp/AppIcon.iconset -o "$RES/AppIcon.icns"
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          xcrun clang -fobjc-arc -fblocks -arch x86_64 -mmacosx-version-min=10.15 -isysroot "$SDK" -framework Cocoa /tmp/native-src/main.m -o "$EXE"
          chmod +x "$EXE"
          codesign --force --deep --sign - "$APP"
          codesign --verify --deep --strict "$APP"
          lipo -info "$EXE" | grep -q 'x86_64'
          test "$(defaults read "$APP/Contents/Info" LSMinimumSystemVersion)" = '10.15.0'
          test "$(defaults read "$APP/Contents/Info" CFBundleShortVersionString)" = '2.1.0'
          /usr/libexec/PlistBuddy -c 'Print :CFBundleURLTypes:0:CFBundleURLSchemes:0' "$APP/Contents/Info.plist" | grep -q '^ccstation$'
          strings "$EXE" | grep -q 'native-station-api.php'
          strings "$EXE" | grep -q 'native-mac-pair.php'
          strings "$EXE" | grep -q 'Pair This Mac in Your Browser'

      - name: Package and verify DMG
        shell: bash
        run: |
          set -euo pipefail
          ROOT=/tmp/location-station-dmg
          OUT='releases/Church-Communications-Mac-Location-Station-2.1.0.dmg'
          rm -rf "$ROOT" "$OUT"
          mkdir -p "$ROOT" releases
          ditto '/tmp/Church Communications Location Station 2.1.0.app' "$ROOT/Church Communications Location Station 2.1.0.app"
          ln -s /Applications "$ROOT/Applications"
          hdiutil create -volname 'Church Communications Location Station 2.1.0' -srcfolder "$ROOT" -ov -format UDZO "$OUT"
          hdiutil verify "$OUT"
          test -s "$OUT"
          shasum -a 256 "$OUT" | tee releases/Church-Communications-Mac-Location-Station-2.1.0.dmg.sha256.txt

      - name: Publish verified Mac DMG
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sBranha'
          git config user.email 'sgbcdb@gmail.com'
          git pull --rebase origin main
          git add releases/Church-Communications-Mac-Location-Station-2.1.0.dmg releases/Church-Communications-Mac-Location-Station-2.1.0.dmg.sha256.txt
          git commit -m 'Publish verified Mac Location Station 2.1.0' || exit 0
          git push
