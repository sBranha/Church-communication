name: Build Native Mac Location Station

on:
  push:
    branches:
      - main
    paths:
      - staging/native-mac-location-station-2.1.1/READY*

permissions:
  contents: write

jobs:
  build-native-mac:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - name: Build Mac Location Station 2.1.1
        shell: bash
        run: bash scripts/build-mac-location-station-2.1.1.sh
      - name: Publish verified DMG
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sBranha'
          git config user.email 'sgbcdb@gmail.com'
          git pull --rebase origin main
          git add releases/Church-Communications-Mac-Location-Station-2.1.1.dmg releases/Church-Communications-Mac-Location-Station-2.1.1.dmg.sha256.txt
          git commit -m 'Publish Mac Location Station 2.1.1 multi-device pairing' || exit 0
          git push
