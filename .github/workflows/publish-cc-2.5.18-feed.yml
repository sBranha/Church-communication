name: Publish Church Communications 2.5.18 Feed

on:
  push:
    branches: [main]
    paths:
      - 'staging/cc-2.5.18-feed-READY*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish verified 2.5.18 files
        shell: bash
        run: |
          set -euo pipefail
          base64 -d staging/cc-2.5.18-update-package.b64 > /tmp/cc2518.zip
          mkdir -p releases/2.5.18
          unzip -p /tmp/cc2518.zip native-station-api.php > releases/2.5.18/native-station-api.php
          unzip -p /tmp/cc2518.zip station-key.php > releases/2.5.18/station-key.php
          unzip -p /tmp/cc2518.zip VERSION.txt > releases/2.5.18/VERSION.txt
          NATIVE=$(sha256sum releases/2.5.18/native-station-api.php | awk '{print $1}')
          KEY=$(sha256sum releases/2.5.18/station-key.php | awk '{print $1}')
          VER=$(sha256sum releases/2.5.18/VERSION.txt | awk '{print $1}')
          test "$NATIVE" = 'c66820701a9b412aad315bf4f82993232b594c0eeb83c0c5b3a4bf6a88b66831'
          test "$KEY" = '01f720c8acda526bd64ef24144100d056223cc4072d330738fe6dd76f4252d99'
          test "$VER" = '542ea68c476dac33e61dc6acfcd184748252c484d8d69570ac08fd1f7e8beb4d'
          php -l releases/2.5.18/native-station-api.php
          php -l releases/2.5.18/station-key.php
          cat > update.json <<EOF
          {
            "version": "2.5.18",
            "requires": "2.5.17",
            "notes": "Permanent Mac Station Key update. Verified file-by-file installation; live config, database, and data directory are preserved.",
            "files": [
              {"path":"native-station-api.php","url":"https://raw.githubusercontent.com/sBranha/Church-communication/main/releases/2.5.18/native-station-api.php","sha256":"$NATIVE"},
              {"path":"station-key.php","url":"https://raw.githubusercontent.com/sBranha/Church-communication/main/releases/2.5.18/station-key.php","sha256":"$KEY"},
              {"path":"VERSION.txt","url":"https://raw.githubusercontent.com/sBranha/Church-communication/main/releases/2.5.18/VERSION.txt","sha256":"$VER"}
            ]
          }
          EOF
          python3 -m json.tool update.json >/dev/null
      - name: Commit feed
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sBranha'
          git config user.email 'sgbcdb@gmail.com'
          git add releases/2.5.18 update.json
          git commit -m 'Publish Church Communications 2.5.18 verified file feed' || exit 0
          git push origin HEAD:main
