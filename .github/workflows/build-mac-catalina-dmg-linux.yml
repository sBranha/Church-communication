name: Build Catalina Mac Location Alert DMG on Linux

on:
  push:
    branches: [main]
    paths:
      - 'staging/mac-catalina-dmg-120c/LINUX_READY*'

permissions:
  contents: write

jobs:
  build-dmg-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and verify Catalina app source
        shell: bash
        run: |
          set -euo pipefail
          cat staging/mac-catalina-dmg-120c/part-*.b64 | base64 -d > /tmp/Church-Communications-Mac-Catalina-Location-Alert-1.2.0.zip
          unzip -t /tmp/Church-Communications-Mac-Catalina-Location-Alert-1.2.0.zip
          rm -rf /tmp/ccmac /tmp/cc-dmg-root
          mkdir -p /tmp/ccmac /tmp/cc-dmg-root
          unzip -q /tmp/Church-Communications-Mac-Catalina-Location-Alert-1.2.0.zip -d /tmp/ccmac
          APP='/tmp/ccmac/Church Communications Location Alert.app'
          test -d "$APP"
          chmod +x "$APP/Contents/MacOS/Church Communications Location Alert"
          grep -q '<string>1.2.0</string>' "$APP/Contents/Info.plist"
          grep -q '<string>10.15.0</string>' "$APP/Contents/Info.plist"
          grep -q 'ChurchCommunications-Mac-Catalina/1.2.0' "$APP/Contents/Resources/location_alert.py"
          cp -a "$APP" '/tmp/cc-dmg-root/Church Communications Location Alert.app'
          ln -s /Applications '/tmp/cc-dmg-root/Applications'

      - name: Install Linux DMG toolchain
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y genisoimage cmake build-essential zlib1g-dev git
          git clone --depth 1 https://github.com/fanquake/libdmg-hfsplus.git /tmp/libdmg-hfsplus
          cmake -S /tmp/libdmg-hfsplus -B /tmp/libdmg-build
          cmake --build /tmp/libdmg-build -j2
          test -x /tmp/libdmg-build/dmg/dmg

      - name: Build HFS+ DMG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p releases
          ISO='/tmp/Church-Communications-Mac-Catalina-Location-Alert-1.2.0.iso'
          OUT='releases/Church-Communications-Mac-Catalina-Location-Alert-1.2.0.dmg'
          genisoimage -hfs -V 'Church Communications' -D -no-pad -r -file-mode 0755 -o "$ISO" /tmp/cc-dmg-root
          /tmp/libdmg-build/dmg/dmg build "$ISO" "$OUT"
          test -s "$OUT"
          file "$OUT"
          sha256sum "$OUT" | tee releases/Church-Communications-Mac-Catalina-Location-Alert-1.2.0.dmg.sha256.txt

      - name: Publish DMG
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'sBranha'
          git config user.email 'sgbcdb@gmail.com'
          git pull --rebase origin main
          git add releases/Church-Communications-Mac-Catalina-Location-Alert-1.2.0.dmg releases/Church-Communications-Mac-Catalina-Location-Alert-1.2.0.dmg.sha256.txt
          git commit -m 'Publish Catalina Mac Location Alert 1.2.0 DMG' || exit 0
          git push
