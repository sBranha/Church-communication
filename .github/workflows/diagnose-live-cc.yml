name: Diagnose Live Church Communications

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-live-cc.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Verify public location helper endpoint
        shell: bash
        run: |
          set -euo pipefail
          URL='https://www.compassionworship.com/cc/location-helper-api.php?action=pair_json'
          echo '=== GET ==='
          curl -sS -o /tmp/getbody -D /tmp/gethdr -w 'status=%{http_code} type=%{content_type}\n' "$URL"
          grep -iE '^(HTTP/|location:|content-type:)' /tmp/gethdr || true
          cat /tmp/getbody
          echo
          echo '=== POST dummy code ==='
          STATUS=$(curl -sS -o /tmp/postbody -D /tmp/posthdr -w '%{http_code}' \
            -X POST "$URL" \
            -H 'Accept: application/json' \
            -H 'Content-Type: application/x-www-form-urlencoded; charset=utf-8' \
            --data 'code=12345678')
          echo "status=$STATUS"
          grep -iE '^(HTTP/|location:|content-type:)' /tmp/posthdr || true
          cat /tmp/postbody
          echo
          python3 - <<'PY'
          import json
          from pathlib import Path
          obj=json.loads(Path('/tmp/postbody').read_text())
          assert isinstance(obj,dict) and 'ok' in obj, obj
          assert obj.get('ok') is False, obj
          print('PUBLIC_HELPER_JSON_OK', obj)
          PY
          test "$STATUS" = 403 || test "$STATUS" = 422
